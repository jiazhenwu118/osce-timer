<!DOCTYPE html>
<html>
<head>
  <title>OSCE Station</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #111; color: white; padding-top: 10vh; margin: 0; height: 100vh; overflow: hidden; }
    #phase { font-size: 2.5rem; color: #aaa; text-transform: uppercase; margin-bottom: 20px; }
    #timer { font-size: 25vw; font-weight: bold; margin-bottom: 40px; }
    button { padding: 20px 40px; font-size: 1.2rem; background: #dc3545; color: white; border: none; border-radius: 12px; cursor: pointer; }
    #join-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #007bff; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    #join-screen button { background: white; color: #007bff; font-weight: bold; }
  </style>
</head>
<body>
  <div id="join-screen"><h2>OSCE Timer Portal</h2><button onclick="joinAndUnlockAudio()">Tap to Join</button></div>
  <div id="phase">Waiting for Master</div>
  <div id="timer">00:00</div>
  <button onclick="requestExtraTime()">Request Extra Time</button>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyC1YUuGjJtPfKoUvjg3oZ9KWg2qiMCg5Ec", authDomain: "osce-timer-75bc3.firebaseapp.com", databaseURL: "https://osce-timer-75bc3-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "osce-timer-75bc3", storageBucket: "osce-timer-75bc3.firebasestorage.app", messagingSenderId: "1074792422880", appId: "1:1074792422880:web:893bd949b3e610b021df85", measurementId: "G-00NQP07LE2" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('osce_timer');
    let serverOffset = 0, audioCtx, lastAlertedEndTime = 0, state = {};
    firebase.database().ref('.info/serverTimeOffset').on('value', snap => serverOffset = snap.val());
    
    function joinAndUnlockAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator(); osc.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.01);
      document.getElementById('join-screen').style.display = 'none';
    }
    
    function playChime() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator(), gainNode = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.5);
      gainNode.gain.setValueAtTime(1, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
      osc.connect(gainNode); gainNode.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 1);
    }

    db.on('value', snap => { state = snap.val() || {}; if(!state.isRunning) { document.getElementById('timer').innerText = "00:00"; document.getElementById('phase').innerText = "Stopped"; }});
    
    setInterval(() => {
      if (state.isRunning && state.endTime) {
        const timeLeftMs = state.endTime - (Date.now() + serverOffset);
        if (timeLeftMs > 0) {
          document.getElementById('phase').innerText = state.currentPhase;
          document.getElementById('timer').innerText = String(Math.floor(timeLeftMs / 60000)).padStart(2, '0') + ':' + String(Math.floor((timeLeftMs % 60000) / 1000)).padStart(2, '0');
        } else {
          document.getElementById('timer').innerText = "00:00"; document.getElementById('phase').innerText = "Time Up";
          if (state.endTime !== lastAlertedEndTime) { playChime(); lastAlertedEndTime = state.endTime; }
        }
      }
    }, 100);

    function requestExtraTime() { const num = prompt("Station Number:"); if(num) { db.update({ extraTimeRequestedBy: `Station ${num}` }); alert("Sent."); } }
  </script>
</body>
</html>
