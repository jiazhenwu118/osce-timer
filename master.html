<!DOCTYPE html>
<html>
<head>
  <title>OSCE Master Controller</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
    button { padding: 15px 20px; margin: 10px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; }
    .phase-btn { background: #007bff; color: white; }
    .action-btn { background: #28a745; color: white; }
    #requests { margin-top: 30px; color: #dc3545; font-weight: bold; font-size: 1.2rem; padding: 15px; }
  </style>
</head>
<body>
  <h1>OSCE Master Control</h1>
  
  <div id="controls">
    <button class="phase-btn" onclick="startPhase('Reading', 2)">Start Reading (2m)</button>
    <button class="phase-btn" onclick="startPhase('Session', 8)">Start Session (8m)</button>
    <button class="phase-btn" onclick="startPhase('Feedback', 2)">Start Feedback (2m)</button>
    <button class="phase-btn" onclick="startPhase('Moving', 1.5)">Start Moving (1.5m)</button>
  </div>
  
  <hr style="margin: 30px auto; width: 80%; border-top: 1px solid #ccc;">
  
  <button class="action-btn" onclick="addExtraTime(30)">Approve +30s</button>
  <button class="action-btn" style="background:#dc3545;" onclick="stopTimer()">Stop / Reset</button>

  <div id="requests">No extra time requests.</div>

  <script>
    const firebaseConfig = { apiKey: "AIzaSyC1YUuGjJtPfKoUvjg3oZ9KWg2qiMCg5Ec", authDomain: "osce-timer-75bc3.firebaseapp.com", databaseURL: "https://osce-timer-75bc3-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "osce-timer-75bc3", storageBucket: "osce-timer-75bc3.firebasestorage.app", messagingSenderId: "1074792422880", appId: "1:1074792422880:web:893bd949b3e610b021df85", measurementId: "G-00NQP07LE2" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('osce_timer');
    
    let serverOffset = 0;
    firebase.database().ref('.info/serverTimeOffset').on('value', snap => serverOffset = snap.val());

    db.child('extraTimeRequestedBy').on('value', snap => {
      const request = snap.val();
      document.getElementById('requests').innerText = request ? `🚨 ${request} requested extra time!` : 'No extra time requests.';
    });

    function startPhase(phaseName, minutes) {
      db.set({ currentPhase: phaseName, endTime: Date.now() + serverOffset + (minutes * 60000), isRunning: true, extraTimeRequestedBy: "" });
    }

    function addExtraTime(seconds) {
      db.once('value').then(snap => {
        const state = snap.val();
        if(state && state.isRunning) db.update({ endTime: state.endTime + (seconds * 1000), extraTimeRequestedBy: "" });
      });
    }

    function stopTimer() { db.update({ isRunning: false }); }
  </script>
</body>
</html>
